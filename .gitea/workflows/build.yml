name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_RYUK_DISABLED: "true"
    container:
      image: gradle:9.4.1-jdk25
      options: --user root --add-host host.docker.internal:host-gateway
    steps:
      - name: Install checkout runtime
        run: apt-get update && apt-get install -y --no-install-recommends docker.io nodejs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker access
        run: docker info

      - name: Test and build
        run: gradle --no-daemon test integrationTest shadowJar
